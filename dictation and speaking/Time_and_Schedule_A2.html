    <!-- JavaScript Data and Logic -->
    <script>
        // --- DIALOGUES ARRAYS ---
        const dialogue1 = [
            { r: "Alex", t: "Hi Sarah. Do you have a minute to talk about our work schedule for next week?" },
            { r: "Sarah", t: "Yes, of course. I have some free time right now. What do we need to discuss?" },
            { r: "Alex", t: "We have a big meeting on Monday morning, so we need to prepare the room." },
            { r: "Sarah", t: "Okay. I will come to the office early on Monday to set up the chairs." },
            { r: "Alex", t: "Thank you. Also, we need to change our lunch break time on Wednesday." },
            { r: "Sarah", t: "Oh, really? What time is our lunch break on Wednesday now?" },
            { r: "Alex", t: "It will be at one o'clock in the afternoon because of the training session." },
            { r: "Sarah", t: "That works for me. I will update my calendar and set an alarm." }
        ];
        const ipa_d1 = [
            "/haɪ ˈserə. duː juː hæv ə ˈmɪnɪt tuː tɔːk əˈbaʊt aʊər wɜːrk ˈskedʒuːl fɔːr nekst wiːk/",
            "/jes, əv kɔːrs. aɪ hæv sʌm friː taɪm raɪt naʊ. hwʌt duː wiː niːd tuː dɪˈskʌs/",
            "/wiː hæv ə bɪɡ ˈmiːtɪŋ ɑːn ˈmʌndeɪ ˈmɔːrnɪŋ, səʊ wiː niːd tuː prɪˈper ðə ruːm/",
            "/ˈəʊkeɪ. aɪ wɪl kʌm tuː ði ˈɔːfɪs ˈɜːrli ɑːn ˈmʌndeɪ tuː set ʌp ðə tʃerz/",
            "/θæŋk juː. ˈɔːlsəʊ, wiː niːd tuː tʃeɪndʒ aʊər lʌntʃ breɪk taɪm ɑːn ˈwenzdeɪ/",
            "/əʊ, ˈriːəli? hwʌt taɪm ɪz aʊər lʌntʃ breɪk ɑːn ˈwenzdeɪ naʊ/",
            "/ɪt wɪl biː æt wʌn əˈklɑːk ɪn ði ˌæftərˈnuːn bɪˈkʌz əv ðə ˈtreɪnɪŋ ˈseʃn/",
            "/ðæt wɜːrks fɔːr miː. aɪ wɪl ʌpˈdeɪt maɪ ˈkæləndər ænd set ən əˈlɑːrm/"
        ];
        const qs_d1 = [
            { type: "Yes/No", q: "Are they talking about their weekend plans?", ans: "No, they are talking about their work schedule for next week.", ipa: "/nəʊ, ðeɪ ɑːr ˈtɔːkɪŋ əˈbaʊt ðer wɜːrk ˈskedʒuːl fɔːr nekst wiːk/" },
            { type: "Yes/No", q: "Does Sarah have free time right now?", ans: "Yes, she does.", ipa: "/jes, ʃiː dʌz/" },
            { type: "Wh-", q: "When is the big meeting?", ans: "It is on Monday morning.", ipa: "/ɪt ɪz ɑːn ˈmʌndeɪ ˈmɔːrnɪŋ/" },
            { type: "Yes/No", q: "Will Sarah come to the office late on Monday?", ans: "No, she will come early to set up the chairs.", ipa: "/nəʊ, ʃiː wɪl kʌm ˈɜːrli tuː set ʌp ðə tʃerz/" },
            { type: "Yes/No", q: "Do they need to change their dinner time?", ans: "No, they need to change their lunch break time.", ipa: "/nəʊ, ðeɪ niːd tuː tʃeɪndʒ ðer lʌntʃ breɪk taɪm/" },
            { type: "Wh-", q: "What day is the lunch break changing?", ans: "On Wednesday.", ipa: "/ɑːn ˈwenzdeɪ/" },
            { type: "Wh-", q: "Why is the lunch break at one o'clock?", ans: "Because of the training session.", ipa: "/bɪˈkʌz əv ðə ˈtreɪnɪŋ ˈseʃn/" },
            { type: "Wh-", q: "What will Sarah do?", ans: "She will update her calendar and set an alarm.", ipa: "/ʃiː wɪl ʌpˈdeɪt hər ˈkæləndər ænd set ən əˈlɑːrm/" }
        ];

        const dialogue2 = [
            { r: "Alex", t: "Another thing we need to check is the Friday afternoon team activity." },
            { r: "Sarah", t: "Right, the team activity. What time does it usually start on Fridays?" },
            { r: "Alex", t: "It usually starts at three o'clock, but this week we have a lot of work." },
            { r: "Sarah", t: "Should we move the activity to the late afternoon or cancel it?" },
            { r: "Alex", t: "Let's move it to four o'clock so everyone can finish their tasks first." },
            { r: "Sarah", t: "That is a good idea. Will it last for one hour or two hours?" },
            { r: "Alex", t: "It will only last for one hour, so we can all go home on time." },
            { r: "Sarah", t: "Perfect. I will send a message to the team about this new schedule." }
        ];
        const ipa_d2 = [
            "/əˈnʌðər θɪŋ wiː niːd tuː tʃek ɪz ðə ˈfraɪdeɪ ˌæftərˈnuːn tiːm ækˈtɪvəti/",
            "/raɪt, ðə tiːm ækˈtɪvəti. hwʌt taɪm dʌz ɪt ˈjuːʒuəli stɑːrt ɑːn ˈfraɪdeɪz/",
            "/ɪt ˈjuːʒuəli stɑːrts æt θriː əˈklɑːk, bʌt ðɪs wiːk wiː hæv ə lɑːt əv wɜːrk/",
            "/ʃʊd wiː muːv ði ækˈtɪvəti tuː ðə leɪt ˌæftərˈnuːn ɔːr ˈkænsl ɪt/",
            "/lets muːv ɪt tuː fɔːr əˈklɑːk səʊ ˈevriwʌn kæn ˈfɪnɪʃ ðer tæsks fɜːrst/",
            "/ðæt ɪz ə ɡʊd aɪˈdiːə. wɪl ɪt læst fɔːr wʌn aʊər ɔːr tuː aʊərz/",
            "/ɪt wɪl ˈəʊnli læst fɔːr wʌn aʊər, səʊ wiː kæn ɔːl ɡəʊ həʊm ɑːn taɪm/",
            "/ˈpɜːrfɪkt. aɪ wɪl send ə ˈmesɪdʒ tuː ðə tiːm əˈbaʊt ðɪs nuː ˈskedʒuːl/"
        ];
        const qs_d2 = [
            { type: "Wh-", q: "What do they need to check?", ans: "The Friday afternoon team activity.", ipa: "/ðə ˈfraɪdeɪ ˌæftərˈnuːn tiːm ækˈtɪvəti/" },
            { type: "Wh-", q: "What is Sarah asking about?", ans: "She is asking what time the activity usually starts.", ipa: "/ʃiː ɪz ˈæskɪŋ hwʌt taɪm ði ækˈtɪvəti ˈjuːʒuəli stɑːrts/" },
            { type: "Yes/No", q: "Do they have a lot of work this week?", ans: "Yes, they do.", ipa: "/jes, ðeɪ duː/" },
            { type: "Yes/No", q: "Does Sarah want to move it to the morning?", ans: "No, she asks if they should move it to the late afternoon or cancel it.", ipa: "/nəʊ, ʃiː æsks ɪf ðeɪ ʃʊd muːv ɪt tuː ðə leɪt ˌæftərˈnuːn ɔːr ˈkænsl ɪt/" },
            { type: "Wh-", q: "What time will they move the activity to?", ans: "To four o'clock.", ipa: "/tuː fɔːr əˈklɑːk/" },
            { type: "Yes/No", q: "Will the activity last for three hours?", ans: "No, Sarah asks if it will last for one hour or two hours.", ipa: "/nəʊ, ˈserə æsks ɪf ɪt wɪl læst fɔːr wʌn aʊər ɔːr tuː aʊərz/" },
            { type: "Wh-", q: "How long will the activity last?", ans: "It will only last for one hour.", ipa: "/ɪt wɪl ˈəʊnli læst fɔːr wʌn aʊər/" },
            { type: "Wh-", q: "What will Sarah do?", ans: "She will send a message to the team about the new schedule.", ipa: "/ʃiː wɪl send ə ˈmesɪdʒ tuː ðə tiːm əˈbaʊt ðə nuː ˈskedʒuːl/" }
        ];

        const dialogue3 = [
            { r: "Emma", t: "Hello everyone, I want to talk about managing our time at work." },
            { r: "Emma", t: "It is very important to have a clear schedule every day." },
            { r: "Emma", t: "A good schedule helps us finish our work on time and reduces stress." },
            { r: "Emma", t: "I always make a list of tasks before I start my work morning." },
            { r: "Emma", t: "Then, I put the most important tasks at the top of my list." },
            { r: "Emma", t: "It is also necessary to take short breaks to rest our eyes and brain." },
            { r: "Emma", t: "If you feel tired, a five-minute break can give you more energy." },
            { r: "Emma", t: "Please remember to check your email calendar every evening for the next day." }
        ];
        const ipa_d3 = [
            "/həˈləʊ ˈevriwʌn, aɪ wɑːnt tuː tɔːk əˈbaʊt ˈmænɪdʒɪŋ aʊər taɪm æt wɜːrk/",
            "/ɪt ɪz ˈveri ɪmˈpɔːrtnt tuː hæv ə klɪr ˈskedʒuːl ˈevri deɪ/",
            "/ə ɡʊd ˈskedʒuːl helps ʌs ˈfɪnɪʃ aʊər wɜːrk ɑːn taɪm ænd rɪˈduːsɪz stres/",
            "/aɪ ˈɔːlweɪz meɪk ə lɪst əv tæsks bɪˈfɔːr aɪ stɑːrt maɪ wɜːrk ˈmɔːrnɪŋ/",
            "/ðen, aɪ pʊt ðə məʊst ɪmˈpɔːrtnt tæsks æt ðə tɑːp əv maɪ lɪst/",
            "/ɪt ɪz ˈɔːlsəʊ ˈnesəseri tuː teɪk ʃɔːrt breɪks tuː rest aʊər aɪz ænd breɪn/",
            "/ɪf juː fiːl ˈtaɪərd, ə faɪv-ˈmɪnɪt breɪk kæn ɡɪv juː mɔːr ˈenərdʒi/",
            "/pliːz rɪˈmembər tuː tʃek jʊər ˈiːmeɪl ˈkæləndər ˈevri ˈiːvnɪŋ fɔːr ðə nekst deɪ/"
        ];
        const qs_d3 = [
            { type: "Wh-", q: "What does Emma want to talk about?", ans: "Managing time at work.", ipa: "/ˈmænɪdʒɪŋ taɪm æt wɜːrk/" },
            { type: "Yes/No", q: "Is it important to have a clear schedule?", ans: "Yes, it is very important.", ipa: "/jes, ɪt ɪz ˈveri ɪmˈpɔːrtnt/" },
            { type: "Wh-", q: "What does a good schedule help us do?", ans: "Finish our work on time and reduce stress.", ipa: "/ˈfɪnɪʃ aʊər wɜːrk ɑːn taɪm ænd rɪˈduːs stres/" },
            { type: "Wh-", q: "What does Emma make before she starts working?", ans: "She makes a list of tasks.", ipa: "/ʃiː meɪks ə lɪst əv tæsks/" },
            { type: "Wh-", q: "Where does she put the most important tasks?", ans: "At the top of her list.", ipa: "/æt ðə tɑːp əv hər lɪst/" },
            { type: "Yes/No", q: "Is it necessary to work without resting?", ans: "No, it is necessary to take short breaks.", ipa: "/nəʊ, ɪt ɪz ˈnesəseri tuː teɪk ʃɔːrt breɪks/" },
            { type: "Yes/No", q: "Can a five-minute break give you energy?", ans: "Yes, it can give you more energy.", ipa: "/jes, ɪt kæn ɡɪv juː mɔːr ˈenərdʒi/" },
            { type: "Wh-", q: "What should you check every evening?", ans: "Your email calendar for the next day.", ipa: "/jʊər ˈiːmeɪl ˈkæləndər fɔːr ðə nekst deɪ/" }
        ];

        const slidesData = [
            // Slide 1
            { type: 'title', title: "Time & Schedule", subtitle: "Level: A2", color: 'sky' },
            // Slide 2
            { type: 'list', title: "Warm up Questions", level: "A2", items: [
                "1. Do you use a calendar or a notebook to plan your day?",
                "2. What time do you usually start and finish your work?",
                "3. Do you prefer having a busy schedule or a lot of free time?"
            ]},
            // Slide 3
            { type: 'prediction', title: "Prediction Activity", desc: "Look at the pictures. What do you think the two coworkers will discuss?", images: [
                "https://images.unsplash.com/photo-1506784983877-45594efa4cbe?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80", 
                "https://images.unsplash.com/photo-1434494878577-86c23bcb06b9?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80", 
                "https://images.unsplash.com/photo-1511882150382-421056c89033?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80"  
            ]},
            // Slide 4
            { type: 'audio-mcq', title: "Listen and Choose", 
              script: dialogue1, 
              question: "What is the main topic of their conversation?", options: ["(A) A birthday party", "(B) Work schedule and meetings", "(C) Buying new chairs", "(D) A vacation plan"], answer: 1 }
        ];

        // Slide 5-12
        for(let i=0; i<8; i++){
            slidesData.push({
                type: 'breakdown', title: "Conversation Breakdown", num: i+1, 
                role: dialogue1[i].r, sentence: dialogue1[i].t, blankRatio: 0.35,
                ipa: ipa_d1[i], voice: dialogue1[i].r === 'Alex' ? 'speaker1' : 'speaker2',
                qType: qs_d1[i].type, qText: qs_d1[i].q, qAns: qs_d1[i].ans, qIpa: qs_d1[i].ipa
            });
        }

        // Slide 13, 14
        slidesData.push({ type: 'full-script', title: "Conversation: Script", script: dialogue1 });
        slidesData.push({ type: 'speaking', title: "Speaking Activity", icon: "comments", text: "Tell me about your schedule for tomorrow. What time will you wake up and what is your most important task?" });

        // Slide 15
        slidesData.push({ type: 'prediction', title: "Prediction Activity", desc: "They continue talking. What do you think they will discuss next?", images: [
            "https://images.unsplash.com/photo-1552581234-26160f608093?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80", 
            "https://images.unsplash.com/photo-1454165804606-c3d57bc86b40?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80", 
            "https://images.unsplash.com/photo-1521737711867-e3b97375f902?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80"  
        ]});

        // Slide 16
        slidesData.push({ type: 'audio-mcq', title: "Listen and Choose", 
              script: dialogue2, 
              question: "What are they planning to do with the Friday activity?", options: ["(A) Move it to four o'clock", "(B) Move it to Monday", "(C) Cancel it completely", "(D) Make it three hours long"], answer: 0 });

        // Slide 17-24

        function generateBlankSentence(sentence, ratio) {
            const targetWords = [
                'schedule', 'week', 'minute', 'free', 'discuss', 'meeting', 'monday', 'morning', 'prepare', 'room', 
                'office', 'early', 'chairs', 'change', 'lunch', 'break', 'wednesday', 'time', 'afternoon', 'training', 
                'session', 'update', 'calendar', 'alarm', 'friday', 'team', 'activity', 'starts', 'usually', 'work', 
                'move', 'late', 'cancel', 'finish', 'tasks', 'idea', 'hour', 'hours', 'home', 'perfect', 'message', 
                'managing', 'important', 'clear', 'reduces', 'stress', 'list', 'start', 'top', 'necessary', 'short', 
                'breaks', 'rest', 'eyes', 'brain', 'tired', 'energy', 'remember', 'check', 'email', 'evening'
            ];
            const words = sentence.split(' ');
            const numToHide = Math.max(1, Math.round(words.length * ratio));
            
            const wordData = words.map((w, i) => {
                const cleanWord = w.replace(/[^a-zA-Z]/g, '');
                return { index: i, original: w, clean: cleanWord, length: cleanWord.length };
            });
            
            const sortedByLen = [...wordData].sort((a, b) => {
                const aClean = a.clean.toLowerCase();
                const bClean = b.clean.toLowerCase();
                const aIsTarget = (targetWords.includes(aClean) && !hiddenTargetWords.has(aClean)) ? 1 : 0;
                const bIsTarget = (targetWords.includes(bClean) && !hiddenTargetWords.has(bClean)) ? 1 : 0;
                if (aIsTarget !== bIsTarget) return bIsTarget - aIsTarget;
                return b.length - a.length;
            });
            const hideIndices = sortedByLen.slice(0, numToHide).map(w => w.index);
            
            hideIndices.forEach(idx => {
                const cleanWord = wordData[idx].clean.toLowerCase();
                if (targetWords.includes(cleanWord)) {
                    hiddenTargetWords.add(cleanWord);
                }
            });
            
            let html = '<div class="flex flex-wrap items-center gap-x-2 gap-y-4 leading-loose text-xl font-medium text-gray-800 w-full">';
            
            words.forEach((w, index) => {
                if (hideIndices.includes(index) && wordData[index].length > 0) {
                    const match = w.match(/^([^a-zA-Z]*)([a-zA-Z\-\']+)([^a-zA-Z]*)$/);
                    if (match) {
                        const prefix = match[1];
                        const word = match[2];
                        const suffix = match[3];
                        const wPx = Math.max(40, word.length * 15 + 10); 
                        html += `<span class="inline-flex items-center">${prefix}<input type="text" class="dictation-input border-b-2 border-gray-300 focus:border-sky-500 bg-transparent text-center text-sky-600 font-bold outline-none px-1" style="width: ${wPx}px;" data-answer="${escapeHTML(word.toLowerCase())}">${suffix}</span>`;
                    } else { html += `<span>${w}</span>`; }
                } else { html += `<span>${w}</span>`; }
            });

            html += `<button class="check-btn ml-2 shrink-0 w-9 h-9 rounded-full bg-gray-100 hover:bg-gray-200 text-gray-500 transition-colors tooltip" title="Check All"><i class="fas fa-check"></i></button></div>`;
            return html;
        }

        // --- WEB SPEECH API & TTS LOGIC ---
        let synth = window.speechSynthesis;
        let availableVoices = [];
        
        let currentDialogue = [];
        let dialogueIndex = 0;
        
        window.speechUtterances = []; 

        function populateVoiceList() {
            availableVoices = synth.getVoices();
            if (availableVoices.length === 0) return;

            const enVoices = availableVoices.filter(v => v.lang.startsWith('en-'));
            
            const strictVoices = enVoices.filter(v => 
                v.name.includes('Emma') || 
                v.name.includes('Jenny') || 
                v.name.includes('Andrew') || 
                v.name.includes('Brian')
            );
            
            const displayList = strictVoices.length > 0 ? strictVoices : enVoices;

            const configs = [
                { id: 'voice-speaker1', priorities: ['Andrew', 'Brian Natural', 'Male'] },
                { id: 'voice-speaker2', priorities: ['Jenny', 'Emma', 'Female'] },
                { id: 'voice-speaker3', priorities: ['Emma', 'Jenny', 'Female'] }
            ];
            
            configs.forEach(config => {
                const selectEl = document.getElementById(config.id);
                if (!selectEl) return;
                
                const prevValue = selectEl.value; 
                selectEl.innerHTML = ''; 
                
                displayList.forEach(voice => {
                    const option = document.createElement('option');
                    option.textContent = `${voice.name} (${voice.lang})`;
                    option.value = voice.voiceURI;
                    selectEl.appendChild(option);
                });
                
                let bestMatchIndex = -1;
                for (let keyword of config.priorities) {
                    bestMatchIndex = Array.from(selectEl.options).findIndex(opt => opt.textContent.includes(keyword));
                    if (bestMatchIndex !== -1) {
                        break;
                    }
                }
                
                if (bestMatchIndex !== -1) {
                    selectEl.selectedIndex = bestMatchIndex;
                } else if (selectEl.options.length > 0) {
                    selectEl.selectedIndex = 0;
                }

                if (prevValue && selectEl.querySelector(`option[value="${prevValue}"]`)) {
                    selectEl.value = prevValue;
                }
            });
        }

        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = populateVoiceList;
        }

        function getVoiceForRole(role) {
            if (!role || availableVoices.length === 0) return null;
            
            const selectId = `voice-${role.toLowerCase()}`;
            const selectEl = document.getElementById(selectId);
            
            if (selectEl && selectEl.value) {
                const voice = availableVoices.find(v => v.voiceURI === selectEl.value);
                if (voice) return voice;
            }
            
            return availableVoices.find(v => v.lang.startsWith('en-')) || availableVoices[0];
        }

        function cancelAudioSafe() {
            window.speechSynthesis.pause();
            window.speechSynthesis.cancel();
            currentDialogue = [];
            dialogueIndex = 0;
            window.speechUtterances = []; 
        }

        function playTTS(text, voiceRole) {
            cancelAudioSafe();
            setTimeout(() => {
                if (text !== '') {
                    const utterThis = new SpeechSynthesisUtterance(text);
                    const voice = getVoiceForRole(voiceRole);
                    if (voice) {
                        utterThis.voice = voice;
                    }
                    utterThis.rate = 0.8; // User requested voice rate 0.8
                    window.speechUtterances.push(utterThis);
                    synth.speak(utterThis);
                }
            }, 50);
        }

        function playDialogueSequence() {
            if (dialogueIndex >= currentDialogue.length) {
                return;
            }
            const line = currentDialogue[dialogueIndex];
            const utterThis = new SpeechSynthesisUtterance(line.t);
            utterThis.rate = 0.8; // Voice rate 0.8
            
            // Map character names to voice roles
            let voiceRole = 'speaker1';
            if (line.r === 'Sarah') voiceRole = 'speaker2';
            else if (line.r === 'Emma') voiceRole = 'speaker3';
            
            const voice = getVoiceForRole(voiceRole);
            if (voice) {
                utterThis.voice = voice;
            }
            
            utterThis.onend = function() {
                dialogueIndex++;
                setTimeout(playDialogueSequence, 300);
            };
            
            utterThis.onerror = function() {
                dialogueIndex++;
                setTimeout(playDialogueSequence, 300);
            };

            window.speechUtterances.push(utterThis);
            synth.speak(utterThis);
        }

            document.getElementById('settings-modal').classList.remove('hidden');
            document.getElementById('settings-modal').classList.add('flex');
            populateVoiceList(); 
        }

        function closeSettings() {
            document.getElementById('settings-modal').classList.add('hidden');
            document.getElementById('settings-modal').classList.remove('flex');
        }

        // Initialization
        window.addEventListener('load', () => {
            renderSlides();
            updateNav();
            setTimeout(populateVoiceList, 100); 
        });

    </script>
</body>
</html>
