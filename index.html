<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Grammar Hub</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="dashboard-body">
    <header>
        <a href="index.html" class="logo">GrammarHub ✨</a>
        <nav>
            <ul>
                <li><a href="index.html" class="active">Dashboard</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Progress</a></li>
            </ul>
        </nav>
    </header>

    <div class="layout-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <h2 class="sidebar-title"><i class="fa-solid fa-layer-group"></i> Topics</h2>
            <!-- Khu vực Sidebar sẽ được JavaScript bơm tự động vào đây -->
            <ul class="topic-list" id="dynamic-sidebar">
                <li style="text-align: center; color: var(--gray); padding: 1.5rem 0;">
                    <i class="fa-solid fa-spinner fa-spin" style="margin-right: 8px;"></i> Loading lessons...
                </li>
            </ul>
        </aside>

        <!-- Main Quiz Area -->
        <main class="main-content">
            <div class="quiz-container">
                <div class="quiz-header">
                    <h2>Daily Grammar Challenge 🔥</h2>
                    <p>Test your knowledge with random questions!</p>
                </div>
                
                <div class="quiz-card">
                    <div class="quiz-topic-badge" id="quiz-topic">Topic</div>
                    <h3 class="question-text" id="question-text">Loading question...</h3>
                    
                    <div class="options-grid" id="options-grid">
                        <button class="option-btn" data-index="0">A. <span class="opt-text">...</span></button>
                        <button class="option-btn" data-index="1">B. <span class="opt-text">...</span></button>
                        <button class="option-btn" data-index="2">C. <span class="opt-text">...</span></button>
                        <button class="option-btn" data-index="3">D. <span class="opt-text">...</span></button>
                    </div>

                    <div class="feedback-area hidden" id="feedback-area">
                        <p class="feedback-msg" id="feedback-msg"></p>
                        <button class="next-btn" id="next-btn">Next Question <i class="fa-solid fa-arrow-right"></i></button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <footer>
        <p>&copy; 2024 English Grammar Hub. Designed for seamless learning.</p>
    </footer>

    <script src="assets/js/script.js"></script>
</body>
</html>
