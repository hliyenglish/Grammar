<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thử Thách 100 Câu Trắc Nghiệm Tính Từ (Tổng Hợp)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f0f4f8;
            --primary: #2980b9; 
            --primary-light: #e6f2ff;
            --text-main: #2c3e50;
            --text-light: #7f8c8d;
            --success: #27ae60;
            --error: #c0392b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Quicksand', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); line-height: 1.7; }

        .navbar { background-color: white; padding: 1rem 2rem; box-shadow: 0 4px 15px rgba(0,0,0,0.05); display: flex; justify-content: center; align-items: center; position: sticky; top: 0; z-index: 100; }
        .brand { font-size: 1.5rem; font-weight: 700; color: var(--primary); }

        .container { max-width: 900px; margin: 2rem auto; padding: 0 1rem; }

        .header-section { text-align: center; margin-bottom: 2rem; background: white; padding: 2.5rem; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.04); }
        .header-section h1 { color: var(--primary); font-size: 2.2rem; margin-bottom: 0.5rem; font-weight: 800; }
        .progress-bar { width: 100%; height: 15px; background-color: #e0e0e0; border-radius: 10px; margin: 1.5rem auto; overflow: hidden; }
        .progress-fill { height: 100%; background-color: var(--success); width: 0%; transition: width 0.3s ease; }
        
        .score-display { font-size: 1.5rem; font-weight: 800; color: var(--primary); margin-top: 1rem; }
        .score-display span { color: var(--success); }

        .content-card { background: white; padding: 3rem; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
        
        .quiz-item { margin-bottom: 2.5rem; padding-bottom: 2.5rem; border-bottom: 2px dashed #eee; animation: fadeIn 0.5s ease; }
        .quiz-item:last-child { border-bottom: none; }
        .quiz-question { font-size: 1.3rem; font-weight: 700; margin-bottom: 1.5rem; color: #34495e; }
        
        .options-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; }
        .opt-btn { padding: 15px; border: 2px solid #eaeaea; background: #fafafa; border-radius: 12px; cursor: pointer; font-size: 1.1rem; font-weight: 600; transition: all 0.2s; color: var(--text-main); text-align: center; }
        .opt-btn:hover:not(:disabled) { border-color: var(--primary); background: white; transform: translateY(-2px); }
        .opt-btn.correct { background: #d5f5e3; border-color: var(--success); color: #1e8449; }
        .opt-btn.incorrect { background: #fadbd8; border-color: var(--error); color: #a93226; }
        .opt-btn:disabled { cursor: not-allowed; opacity: 0.9; }
        
        .explanation { display: none; margin-top: 1.5rem; padding: 1.2rem; background: var(--primary-light); border-radius: 10px; border-left: 5px solid var(--primary); color: #1a5276; font-weight: 600; font-size: 1.1rem; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="brand">🏆 Bài Kiểm Tra Cuối Khóa: 100 Câu Tính Từ</div>
    </nav>

    <div class="container">
        <div class="header-section">
            <h1>Thử Thách 100 Câu Tính Từ</h1>

            <div class="progress-bar">
                <div class="progress-fill" id="main-progress"></div>
            </div>
            <div class="score-display">Tiến độ: <span id="progress-text">0/100</span></div>
        </div>

        <div class="content-card" id="quiz-container">
            <!-- Quizzes injected here via JS -->
        </div>
    </div>

    <script>
        // 100 Questions covering Adjective course (Normal version)
        const questionsDB = [
            // --- MODULE 1: VỊ TRÍ & TRẬT TỰ OSASCOMP (1-25) ---
            { q: "The soup smells _____. I can't wait to eat it.", opts: ["deliciously", "delicious", "deliciousness"], ans: 1, exp: "Sau động từ tri giác 'smell' phải dùng Tính từ -> delicious." },
            { q: "She bought a _____ dress yesterday.", opts: ["beautiful new red", "new beautiful red", "red beautiful new"], ans: 0, exp: "OSASCOMP: Opinion (beautiful) -> Age (new) -> Color (red)." },

            { q: "I found a _____ coin on the street.", opts: ["old silver valuable", "valuable old silver", "silver valuable old"], ans: 1, exp: "Opinion (valuable) -> Age (old) -> Material (silver)." },
            { q: "He drives _____, but his car is very fast.", opts: ["careful", "carefully", "care"], ans: 1, exp: "Đứng sau động từ thường 'drives' phải dùng Trạng từ -> carefully." },
            { q: "That sounds _____! I will join the party.", opts: ["greatly", "great", "greatness"], ans: 1, exp: "Sau 'sound' là tính từ -> great." },
            { q: "They live in a _____ house.", opts: ["large modern white", "modern large white", "white large modern"], ans: 0, exp: "Size (large) -> Age (modern) -> Color (white)." },
            { q: "He gave his wife a _____ ring.", opts: ["diamond beautiful expensive", "expensive diamond beautiful", "beautiful expensive diamond"], ans: 2, exp: "Opinion (beautiful) -> Opinion 2 (expensive) -> Material (diamond)." },

            { q: "I need to buy a _____ pan for making pancakes.", opts: ["new black frying", "black new frying", "frying new black"], ans: 0, exp: "Age (new) -> Color (black) -> Purpose (frying)." },
            { q: "She has _____ eyes.", opts: ["blue big beautiful", "beautiful big blue", "big beautiful blue"], ans: 1, exp: "Opinion (beautiful) -> Size (big) -> Color (blue)." },
            { q: "The weather became _____ in the afternoon.", opts: ["cold", "coldly", "coldness"], ans: 0, exp: "Sau động từ liên kết 'become' dùng tính từ -> cold." },
            { q: "I bought some _____ apples.", opts: ["red delicious French", "delicious red French", "French red delicious"], ans: 1, exp: "Opinion (delicious) -> Color (red) -> Origin (French)." },

            { q: "She is a _____ runner.", opts: ["fast", "fastly", "fastness"], ans: 0, exp: "Đứng trước danh từ runner cần tính từ -> fast." },
            { q: "He runs very _____.", opts: ["fast", "fastly", "quick"], ans: 0, exp: "Trạng từ của fast vẫn là fast (không có fastly)." },
            { q: "It was a _____ decision.", opts: ["hard", "hardly", "hardness"], ans: 0, exp: "Tính từ -> hard (Quyết định khó khăn)." },
            { q: "He works _____ to support his family.", opts: ["hard", "hardly", "harder"], ans: 0, exp: "Trạng từ của hard vẫn là hard (làm việc chăm chỉ). Hardly nghĩa là 'hầu như không'." },

            // --- MODULE 2: TÍNH TỪ ĐUÔI -ED & -ING (26-50) ---
            { q: "I was very _____ when I heard the news.", opts: ["surprising", "surprised", "surprise"], ans: 1, exp: "Cảm xúc của người (BỊ ngạc nhiên) -> -ED." },

            { q: "The instructions were very _____. Nobody understood them.", opts: ["confusing", "confused", "confuse"], ans: 0, exp: "Bản chất của hướng dẫn (gây khó hiểu) -> -ING." },
            { q: "He is such an _____ person. Everyone loves talking to him.", opts: ["interesting", "interested", "interest"], ans: 0, exp: "Bản chất của người đó (gây thú vị cho người khác) -> -ING." },
            { q: "We had a _____ journey. We drove for 10 hours.", opts: ["tiring", "tired", "tire"], ans: 0, exp: "Bản chất của chuyến đi (gây mệt) -> tiring." },
            { q: "I feel so _____ today. I just want to sleep.", opts: ["tiring", "tired", "tire"], ans: 1, exp: "Cảm xúc của tôi (cảm thấy mệt) -> tired." },
            { q: "The football match was very _____. Our team won at the last minute.", opts: ["exciting", "excited", "excite"], ans: 0, exp: "Bản chất trận đấu (gây hào hứng) -> exciting." },
            { q: "The kids were so _____ about going to the zoo.", opts: ["exciting", "excited", "excite"], ans: 1, exp: "Cảm xúc của bọn trẻ -> excited." },
            { q: "It was a _____ experience. I will never forget it.", opts: ["frightening", "frightened", "frighten"], ans: 0, exp: "Trải nghiệm mang tính chất đáng sợ -> frightening." },
            { q: "She is terrified of spiders. She feels _____ when she sees one.", opts: ["terrifying", "terrified", "terrify"], ans: 1, exp: "Cảm xúc của cô ấy (bị kinh hãi) -> terrified." },
            { q: "The results of the exam were _____. Many students failed.", opts: ["disappointing", "disappointed", "disappoint"], ans: 0, exp: "Bản chất kết quả (gây thất vọng) -> disappointing." },
            { q: "My parents were _____ when I failed the exam.", opts: ["disappointing", "disappointed", "disappoint"], ans: 1, exp: "Cảm xúc của bố mẹ -> disappointed." },
            { q: "That is a _____ story. Tell me more!", opts: ["fascinating", "fascinated", "fascinate"], ans: 0, exp: "Bản chất câu chuyện (cực kỳ thú vị/lôi cuốn) -> fascinating." },
            { q: "I was _____ by his performance.", opts: ["amazing", "amazed", "amaze"], ans: 1, exp: "Cảm xúc (bị kinh ngạc) -> amazed." },
            { q: "This job is very _____. I have too much to do.", opts: ["stressful", "stressed", "stressing"], ans: 0, exp: "Bản chất công việc (gây áp lực). Động từ stress dùng dạng tính từ -FUL -> stressful." },
            { q: "I feel _____ because of this job.", opts: ["stressful", "stressed", "stressing"], ans: 1, exp: "Cảm xúc (bị căng thẳng) -> stressed." },
            { q: "The view from the mountain was _____.", opts: ["stunning", "stunned", "stun"], ans: 0, exp: "Bản chất phong cảnh (tuyệt đẹp/gây choáng ngợp) -> stunning." },
            { q: "Everyone was _____ when he announced his resignation.", opts: ["shocking", "shocked", "shock"], ans: 1, exp: "Cảm xúc mọi người (bị sốc) -> shocked." },
            { q: "The news was totally _____.", opts: ["shocking", "shocked", "shock"], ans: 0, exp: "Bản chất tin tức -> shocking." },
            { q: "I find this grammar rule very _____.", opts: ["confusing", "confused", "confuse"], ans: 0, exp: "Find + something + Adj (nhận thấy cái gì đó CÓ BẢN CHẤT thế nào) -> confusing." },
            { q: "The long flight made me feel _____.", opts: ["exhausting", "exhausted", "exhaust"], ans: 1, exp: "Cảm xúc (kiệt sức) -> exhausted." },
            { q: "It was an _____ day at work.", opts: ["exhausting", "exhausted", "exhaust"], ans: 0, exp: "Bản chất một ngày làm việc -> exhausting." },

            // --- MODULE 3: SO SÁNH HƠN / KÉM / NHẤT (51-75) ---
            { q: "This bag is _____ than that one.", opts: ["heavyer", "heavier", "more heavy"], ans: 1, exp: "Tính từ 2 âm tiết tận cùng -y -> đổi thành -ier." },

            { q: "Today is _____ than yesterday.", opts: ["hotter", "hoter", "more hot"], ans: 0, exp: "Tính từ 1 âm tiết, tận cùng 1 nguyên âm + 1 phụ âm -> gấp đôi phụ âm (hotter)." },

            { q: "Please drive _____.", opts: ["more careful", "more carefully", "carefuller"], ans: 1, exp: "So sánh hơn của trạng từ '-ly' -> more carefully." },

            { q: "The rural area is _____ polluted than the city.", opts: ["lesser", "less", "the least"], ans: 1, exp: "So sánh kém hơn (ít ô nhiễm hơn) -> less polluted. Không bao giờ dùng lesser." },
            { q: "It's a beautiful day. The sky is _____ than usual.", opts: ["bluer", "more blue", "bluest"], ans: 0, exp: "blue là tính từ 1 âm tiết -> bluer." },
            { q: "He arrived _____ than anyone else.", opts: ["latiest", "later", "more late"], ans: 1, exp: "late -> later." },
            { q: "Have you heard the _____ news?", opts: ["last", "later", "latest"], ans: 2, exp: "Tin tức mới nhất/gần đây nhất -> the latest." },
            { q: "This sofa is _____ comfortable than the wooden chair.", opts: ["much more", "many more", "more much"], ans: 0, exp: "Nhấn mạnh so sánh hơn dùng 'much' (much more comfortable - thoải mái hơn rất nhiều)." },
            { q: "She is a bit _____ today.", opts: ["happier", "more happy", "happy"], ans: 0, exp: "Tận cùng -y -> happier." },
            { q: "Who is the _____ person in your family?", opts: ["old", "older", "oldest"], ans: 2, exp: "So sánh nhất -> oldest (hoặc eldest cho anh em trong nhà)." },
            { q: "This road is _____ narrow.", opts: ["too", "enough", "many"], ans: 0, exp: "Quá chật (nghĩa tiêu cực) -> too narrow." },
            { q: "The water is _____ to swim in.", opts: ["warm enough", "enough warm", "too warm"], ans: 0, exp: "enough đứng SAU tính từ -> warm enough." },

        // Shuffle function
        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        // Render Quizzes
        let shuffledQuestions = [];
        let score = 0;

        function initQuiz() {
            shuffledQuestions = [...questionsDB];
            const container = document.getElementById('quiz-container');
            container.innerHTML = '';
            
            shuffledQuestions.forEach((q, qIndex) => {
                const quizHtml = `
                    <div class="quiz-item" id="q-${qIndex}">
                        <div class="quiz-question">Câu ${qIndex + 1}: ${q.q}</div>
                        <div class="options-grid">
                            ${q.opts.map((opt, oIndex) => `
                                <button class="opt-btn" onclick="checkAnswer(${qIndex}, ${oIndex}, ${q.ans})">${opt}</button>
                            `).join('')}
                        </div>
                        <div class="explanation" id="exp-${qIndex}">💡 <strong>Giải thích:</strong> ${q.exp}</div>
                    </div>
                `;
                container.innerHTML += quizHtml;
            });
        }

        function checkAnswer(qIndex, selectedOptIndex, correctOptIndex) {
            const quizContainer = document.getElementById(`q-${qIndex}`);
            const buttons = quizContainer.querySelectorAll('.opt-btn');
            
            if(buttons[0].disabled) return;
            
            buttons.forEach(b => b.disabled = true);
            
            if(selectedOptIndex === correctOptIndex) {
                buttons[selectedOptIndex].classList.add('correct');
                score++;
            } else {
                buttons[selectedOptIndex].classList.add('incorrect');
                buttons[correctOptIndex].classList.add('correct');
            }
            
            document.getElementById(`exp-${qIndex}`).style.display = 'block';
            
            // Update progress UI
            const answeredCount = document.querySelectorAll('.quiz-item .opt-btn[disabled]').length / 3;
            document.getElementById('progress-text').innerText = `${Math.floor(answeredCount)}/100`;
            document.getElementById('main-progress').style.width = `${(Math.floor(answeredCount)/100)*100}%`;
        }

        // Start
        window.onload = initQuiz;
    </script>
</body>
</html>
